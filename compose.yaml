services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-solaruser} -d ${DB_NAME:-solardb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_backend
    ports:
      - '8080:8080'
    env_file:
      - .env  # Simpler: passes all variables to backend
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: solar_frontend
    ports:
      - '3000:3000'
    environment:
      # Frontend only needs backend URL (security: doesn't get DB credentials)
      - 'NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8080}'
    depends_on:
      - backend

volumes:
  postgres-data:
