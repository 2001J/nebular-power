services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-solaruser} -d ${DB_NAME:-solardb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_backend
    ports:
      - '${BACKEND_HOST_PORT:-8080}:8080'
    env_file:
      - .env
    environment:
      # Automatically construct URLs based on host ports
      - 'FRONTEND_URL=http://localhost:${FRONTEND_HOST_PORT:-3000}'
      - 'BACKEND_URL=http://localhost:${BACKEND_HOST_PORT:-8080}'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: solar_frontend
    ports:
      - '${FRONTEND_HOST_PORT:-3000}:3000'
    environment:
      # For server-side API calls (inside Docker network)
      - 'NEXT_PUBLIC_API_URL=http://backend:8080'
    depends_on:
      - backend

volumes:
  postgres-data:
