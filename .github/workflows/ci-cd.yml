name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: solar_frontend/pnpm-lock.yaml

      - name: Install deps (pnpm)
        run: corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            solar_frontend/coverage

      - name: Lint
        run: pnpm run lint --if-present

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: pnpm run build

      - name: Archive .next
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-artifacts
          path: |
            solar_frontend/.next
            solar_frontend/next.config.mjs
            solar_frontend/package.json

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B -ntp -DskipTests package

  summary:
    name: CI Summary
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend and Backend jobs finished. Review artifacts and logs."

  frontend-e2e:
    name: Frontend E2E Tests
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: solar_frontend/pnpm-lock.yaml

      - name: Install dependencies (pnpm)
        run: corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile || pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: pnpm run e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: solar_frontend/playwright-report/
          retention-days: 7
