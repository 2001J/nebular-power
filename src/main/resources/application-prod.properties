# Production environment configuration with PostgreSQL

# Database Configuration (values injected from environment variables via compose.yaml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:solardb}
spring.datasource.username=${DB_USER:solaruser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Disable H2 Console in production
spring.h2.console.enabled=false

# Server Configuration
server.port=8080

# The following properties are inherited from application.properties and can be
# overridden via environment variables set in compose.yaml:
# - JWT_SECRET, JWT_EXPIRATION_MS
# - MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
# - FRONTEND_URL
# - ADMIN_EMAIL, ADMIN_PASSWORD (for bootstrap)