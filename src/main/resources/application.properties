spring.application.name=solar

# Database Configuration
spring.datasource.url=jdbc:h2:mem:solardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
# server.port=8080
# server.servlet.context-path=/api

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@example.com}
# Note: For Gmail, you MUST use an App Password, not your regular password
# To create an App Password:
# 1. Enable 2-Step Verification on your Google Account
# 2. Go to your Google Account > Security > App passwords
# 3. Generate a new app password for "Mail"
# 4. Use that 16-character password here (or preferably as an environment variable)
spring.mail.password=${MAIL_PASSWORD:your-app-password-here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Disable mail health check to prevent authentication errors with default credentials
# Remove this line when proper mail credentials are configured via environment variables
management.health.mail.enabled=false

# Frontend URL for email links
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Frontend URL for CORS configuration
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.password-reset.token.expiration=30

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a7c4d9f1b6e8a0c3d2e1f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4
jwt.expiration=86400000

# Monitoring Configuration
monitoring.simulation.enabled=true
monitoring.simulation.interval=5000
monitoring.tamper-detection.check-interval=60000
monitoring.payment.reminder-days=3
monitoring.payment.grace-period-days=7

# Device Command Transmission Configuration
device.command.base-url=http://localhost:8081
device.command.command-path=/api/devices/{installationId}/commands
device.command.connection-timeout=5000
device.command.read-timeout=10000
device.command.max-retries=3
device.command.retry-backoff-ms=1000
device.command.heartbeat-validity-seconds=300
# Enable simulation mode to avoid actual HTTP calls during development/testing
# Set FALSE for HTTP push architecture (backend makes real HTTP calls to Pi Flask server)
# Set TRUE for polling architecture (Pi pulls commands from DB, no HTTP calls needed)
device.command.simulation-mode=true

# Device Command Scheduler Configuration
# Enable/disable automatic command expiration and retry processing
device.command.scheduler.enabled=true
# Command expiration time in hours (default: 24 hours)
device.command.expiration.hours=24
# Cron expression for expiration check (default: every 30 minutes)
device.command.expiration.cron=0 */30 * * * *
# Maximum retry attempts for failed commands (default: 3)
device.command.retry.max-attempts=3
# Minimum delay in minutes between retry attempts (default: 5 minutes)
device.command.retry.delay-minutes=5
# Cron expression for retry processing (default: every 5 minutes)
device.command.retry.cron=0 */5 * * * *

# --- Profile Selection ---
# When running with Docker Compose, the profile is set via SPRING_PROFILES_ACTIVE
# environment variable in compose.yaml (typically 'prod' for PostgreSQL).
# When running locally without Docker (mvn spring-boot:run), this defaults to 'dev'
# which uses the H2 in-memory database configured above.
spring.profiles.active=dev

# --- Optional: H2 schema export ---
# Set to true to export the current H2 schema on startup using H2's SCRIPT command.
# The file will be written relative to the app working directory (default target/schema.sql).
# app.schema.export.enabled=false
# app.schema.export.file=target/schema.sql
# Set to true to include data as INSERT statements (default: false -> schema only)
# app.schema.export.include-data=false
